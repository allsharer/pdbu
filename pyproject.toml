[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdbu"
version = "1.0.0"
description = "PDBU — Personal Directory Backup Utility: rsync-based home directory backup/restore for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PDBU Contributors" }]
keywords = ["backup", "rsync", "luks", "ssh", "gtk"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
gui = ["PyGObject>=3.42"]
dev = ["pytest>=7.0"]

[project.scripts]
pdbu = "pdbu.cli:main"
pdbu-gui = "pdbu.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdbu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
